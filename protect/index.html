<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAプロテクトシミュレーター</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* ==========================================
           シミュレーター画面のスタイル
           ========================================== */
        body { 
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; 
            background-color: #f6f5f0; 
            color: #333;
            margin: 0;
            padding: 10px;
            line-height: 1.6;
        }

        .hidden { display: none !important; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            cursor: pointer;
            color: #0056b3;
            font-weight: bold;
            text-decoration: none;
            font-size: 14px;
        }
        .back-button:hover { text-decoration: underline; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px;}
        .team-select { padding: 6px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc;}
        
        .player-grid-container {
            width: 100%;
        }
        .player-grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 2px; 
            margin-bottom: 20px; 
        }
        @media (min-width: 768px) {
            .player-grid { gap: 8px; }
        }
        
        .category-title { font-weight: bold; font-size: 14px; margin-top: 15px; border-bottom: 2px solid #ccc; padding-bottom: 5px; display: flex; justify-content: space-between;}
        @media (min-width: 768px) {
            .category-title { font-size: 18px; margin-top: 20px; }
        }
        
        .player-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 3px;
            padding: 4px 2px;
            cursor: pointer;
            user-select: none;
            transition: 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        @media (min-width: 768px) {
            .player-card { padding: 10px; border-radius: 5px; }
        }
        .player-card:hover { border-color: #999; }
        
        .player-card.protected {
            background: #1a1a1a;
            color: #fff;
            border: 1.5px solid #d4af37;
        }
        .player-card.protected .name { color: #d4af37; }
        .player-card.protected .stats { color: #ccc; }
        
        .player-info { display: flex; flex-direction: row; align-items: baseline; justify-content: space-between; }
        
        .name { font-size: clamp(9px, 2.2vw, 16px); font-weight: bold; line-height: 1.1; letter-spacing: -0.5px; }
        .age { font-size: clamp(8px, 1.8vw, 12px); color: gray; margin-left: 2px; }
        .stats { font-size: clamp(7px, 1.5vw, 11px); color: #555; margin-top: 4px; line-height: 1.25; overflow-wrap: anywhere; word-break: break-all; }
        
        .counter { font-size: 16px; font-weight: bold; color: #0056b3; }
        @media (min-width: 768px) {
            .counter { font-size: 24px; }
        }
        #statusMessage { margin-bottom: 20px; padding: 15px; background: #fff; border: 1px solid #aaa; border-radius: 5px; color: #333; font-weight: bold;}
    </style>
</head>
<body>

    <div class="container">
        <!-- 一つ上の階層のトップページへ戻るリンク -->
        <a href="../" class="back-button">← たかとらの部屋に戻る</a>
        
        <div id="statusMessage">選手データを読み込んでいます... しばらくお待ちください。</div>

        <div class="header hidden" id="mainHeader">
            <div>
                <h2 style="margin: 0 0 5px 0; font-size: 18px;">FAプロテクトシミュレーター</h2>
                <select id="teamSelector" class="team-select"></select>
            </div>
            <div class="counter">プロテクト: <span id="protectCount">0</span>/28</div>
        </div>

        <div id="playersContainer"></div>
    </div>

    <!-- JSファイルを読み込む -->
    <script src="script.js"></script>
</body>
</html>
