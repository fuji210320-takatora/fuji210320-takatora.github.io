function getRankInfo(num) {
    if (isNaN(num)) return { rank: '-', color: '#999' };
    if (num >= 90) return { rank: 'S', color: '#D4AF37' }; 
    if (num >= 80) return { rank: 'A', color: '#E91E63' }; 
    if (num >= 70) return { rank: 'B', color: '#E53935' }; 
    if (num >= 60) return { rank: 'C', color: '#FF9800' }; 
    if (num >= 50) return { rank: 'D', color: '#FBC02D' }; 
    if (num >= 40) return { rank: 'E', color: '#8BC34A' }; 
    if (num >= 20) return { rank: 'F', color: '#03A9F4' }; 
    return { rank: 'G', color: '#9E9E9E' }; 
}
function parsePositionName(shortPos) {
    const map = { '謐�':'謐墓焔','荳':'荳蝪∵焔','莠�':'莠悟｡∵焔','荳�':'荳牙｡∵焔','驕�':'驕頑茶謇�','蟾ｦ':'蟾ｦ鄙ｼ謇�','荳ｭ':'荳ｭ蝣�焔','蜿ｳ':'蜿ｳ鄙ｼ謇�','DH':'謖�錐謇楢�', 'C':'謐墓焔','1B':'荳蝪∵焔','2B':'莠悟｡∵焔','3B':'荳牙｡∵焔','SS':'驕頑茶謇�','LF':'蟾ｦ鄙ｼ謇�','CF':'荳ｭ蝣�焔','RF':'蜿ｳ鄙ｼ謇�' };
    return map[shortPos.trim().toUpperCase()] || shortPos.trim();
}
function getPositionAptitude(player, targetPos) {
    if (targetPos === '謖�錐謇楢�') return 90;
    if (!player["螳亥ｙ蜉�"]) return 20; 
    if (typeof player["螳亥ｙ蜉�"] === 'number') return player["螳亥ｙ蜉�"];
    let apt = 10;
    player["螳亥ｙ蜉�"].toString().split('/').forEach(p => {
        let splitData = p.split(':');
        if (splitData.length >= 2 && parsePositionName(splitData[0].trim()) === targetPos) { const parsed = parseInt(splitData[1], 10); if (!Number.isNaN(parsed)) apt = parsed; }
    });
    return apt;
}

function startDraft(type) {
    currentDraftType = type; requiredCount = type === 'fielder' ? 9 : 15; skipsLeft = 5;
    draftPool = type === 'fielder' ? [...fieldersData] : [...pitchersData];
    showScreen('screen-draft'); nextCandidate();
}
function nextCandidate() {
    if ((currentDraftType === 'fielder' && myTeam.fielders.length >= requiredCount) || (currentDraftType === 'pitcher' && myTeam.pitchers.length >= requiredCount)) {
        if (currentDraftType === 'fielder') startDraft('pitcher'); else showScreen('screen-league');
        return;
    }
    if (!draftPool.length) { document.getElementById('draft-card').innerHTML = '<div class="card">蛟呵｣憺∈謇九′荳崎ｶｳ縺励※縺�∪縺吶�Excel縺ｮ驕ｸ謇九ョ繝ｼ繧ｿ繧堤｢ｺ隱阪＠縺ｦ縺上□縺輔＞縲�</div>'; return; }
    const randIdx = Math.floor(Math.random() * draftPool.length);
    currentCandidate = draftPool[randIdx];
    
    document.getElementById('draft-type-label').innerText = currentDraftType === 'fielder' ? "驥取焔繝峨Λ繝輔ヨ" : "謚墓焔繝峨Λ繝輔ヨ";

    if (skipsLeft > 0) { document.getElementById('draft-skips').innerText = `隕矩√ｊ谿九ｊ��${skipsLeft}蝗杼; skipBtn.classList.remove('btn-disabled'); skipBtn.disabled = false; }
    else { document.getElementById('draft-skips').innerText = `隕矩√ｊ荳榊庄`; skipBtn.classList.add('btn-disabled'); skipBtn.disabled = true; }

    renderCard(currentCandidate, currentDraftType);
}
function renderCard(player, type) {
    const htmlContainer = document.getElementById('draft-card');
    function createStatCard(label, val) {
        const num = parseInt(val, 10); const data = getRankInfo(num);
        const displayRank = data.rank === '-' ? '' : `<div class="stat-rank" style="color: ${data.color};">${data.rank}</div>`;
        return `<div class="stat-card"><div class="stat-label">${label}</div>${displayRank}<div class="stat-val">${isNaN(num)?'-':num}</div></div>`;
    }
    if (type === 'fielder') {
        let defenseMax = 0; let posTags = [];
        if (typeof player["螳亥ｙ蜉�"] === 'string' && player["螳亥ｙ蜉�"].includes(':')) {
            player["螳亥ｙ蜉�"].split('/').forEach(p => {
                const arr = p.split(':');
                if (arr.length >= 2) {
                    const rating = parseInt(arr[1], 10);
                    if (!isNaN(rating)) { if (rating > defenseMax) defenseMax = rating; posTags.push({ pos: parsePositionName(arr[0].trim()), val: rating }); }
                }
            });
        } else defenseMax = parseInt(player["螳亥ｙ蜉�"], 10) || 0;

        let posHtml = posTags.length > 0 ? `<div style="border-top: 1px dashed #ccc; margin-top: 15px; padding-top: 15px; display: flex; align-items: center; gap: 10px;"><div style="font-size: 13px; color: #555; font-weight: bold;">螳医ｌ繧区園</div><div class="defense-positions">${posTags.map(t => { const r = getRankInfo(t.val); return `<span class="pos-tag">${t.pos} <span style="color:${r.color}; font-size:14px;">${r.rank}</span></span>`; }).join('')}</div></div>` : '';
        htmlContainer.innerHTML = `<div class="card"><div class="p-tag">驥取焔</div><div class="p-name">${player["驕ｸ謇句錐"]||"荳肴�"}</div><div class="p-meta">${player["繝√�繝�"]||"繝輔Μ繝ｼ"}</div><div class="stats-box grid-4">${createStatCard('繝溘�繝�', player["繝溘�繝�"])}${createStatCard('繝代Ρ繝ｼ', player["繝代Ρ繝ｼ"])}${createStatCard('襍ｰ蜉�', player["襍ｰ蜉�"])}${createStatCard('螳亥ｙ蜉�', defenseMax)}</div>${posHtml}</div>`;
    } else {
        let pitchTags = '';
        Object.keys(player).forEach(key => {
            if (key.startsWith('逅�ｨｮ_') && player[key]) {
                const pitchVal = parseInt(player[key], 10);
                if(!isNaN(pitchVal)) { const r = getRankInfo(pitchVal); pitchTags += `<span class="pitch-tag">${key.replace('逅�ｨｮ_', '')} <span style="color:${r.color}; font-size:14px;">${r.rank}</span></span>`; }

            }
        });
        let pitchHtml = pitchTags ? `<div style="border-top: 1px dashed #ccc; margin-top: 15px; padding-top: 15px; display: flex; align-items: center; gap: 10px;"><div style="font-size: 13px; color: #555; font-weight: bold;">逅�ｨｮ</div><div class="pitch-types">${pitchTags}</div></div>` : '';
        htmlContainer.innerHTML = `<div class="card"><div class="p-tag" style="background-color:#E53935;">謚墓焔</div><div class="p-name">${player["驕ｸ謇句錐"]||"荳肴�"}</div><div class="p-meta">${player["繝√�繝�"]||"繝輔Μ繝ｼ"}</div><div class="stats-box grid-3">${createStatCard('逅�ｨ�', player["逅�ｨ�"])}${createStatCard('蛻ｶ逅�', player["蛻ｶ逅�"])}${createStatCard('繧ｹ繧ｿ繝溘リ', player["繧ｹ繧ｿ繝溘リ"])}</div>${pitchHtml}</div>`;

}

function swapOrder(type, currentIndex, newValue) {
    const targetOrder = newValue === '謗ｧ縺�' ? '謗ｧ縺�' : parseInt(newValue, 10); 
    const currentOrder = myTeam.fielders[currentIndex].order;
    const swapTarget = myTeam.fielders.find(p => p.order === targetOrder && p !== myTeam.fielders[currentIndex]);
    if (swapTarget) swapTarget.order = currentOrder;
    myTeam.fielders[currentIndex].order = targetOrder; 
    renderSetupTables();
}
function updatePos(index, newPos) { 
    const currentPos = myTeam.fielders[index].pos;
    const swapTarget = myTeam.fielders.find((p, i) => i !== index && p.pos === newPos);
    if (swapTarget) swapTarget.pos = currentPos;
    myTeam.fielders[index].pos = newPos; 
    renderSetupTables(); 
}
function updatePitcherRole(index, newRole) {
    const currentRole = myTeam.pitchers[index].role;
    const count = myTeam.pitchers.filter(p => p.role === newRole).length;
    const maxAllowed = { '蜈育匱':6, '謚代∴':1, '荳ｭ邯吶℃繧ｨ繝ｼ繧ｹ':1, '蜒�ｷｮ':2, '繝ｪ繝ｼ繝�':2, '繝薙ワ繧､繝ｳ繝�':2, '謨玲姶蜃ｦ逅�':1 };
    if (count >= maxAllowed[newRole]) {
        const swapTarget = myTeam.pitchers.find(p => p.role === newRole);
        if (swapTarget) swapTarget.role = currentRole;
    }
    myTeam.pitchers[index].role = newRole;
    renderSetupTables();
}

function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }
function fatigueFactor(stamina, gameOuts) { let innings = gameOuts / 3.0; if (innings <= 4) return 1.0; return clamp(1.0 - ((innings - 4) * Math.max(0.0, (80.0 - stamina)) * 0.0015), 0.82, 1.0); }
function atBatProbabilities(batter, pitcher, gameOuts) {
    let bCon = parseInt(batter["繝溘�繝�"])||50; let bPow = parseInt(batter["繝代Ρ繝ｼ"])||50;
    let pPow = parseInt(pitcher["逅�ｨ�"])||50; let pCtrl = parseInt(pitcher["蛻ｶ逅�"])||50; let pStamina = parseInt(pitcher["繧ｹ繧ｿ繝溘リ"])||50;
    let soQuality = 25.0 + (pPow * 0.4) + (pCtrl * 0.2); let bbQuality = (pCtrl * 0.8) + 15.0;
    let fatigue = fatigueFactor(pStamina, gameOuts);
    let walk = 0.095 - ((bbQuality - 50.0) * 0.0015) + (bPow>50?(bPow-50)*0.0012:0);
    let so = 0.155 - ((bCon - soQuality) * 0.0008) + (soQuality - 60.0) * 0.0055;
    if (fatigue < 1.0) { walk += (1.0 - fatigue) * 0.02; so -= (1.0 - fatigue) * 0.03; }
    walk = clamp(walk, 0.010, 0.20); so = clamp(so, 0.05, 0.45);
    return [{ result: "walk", prob: walk }, { result: "so", prob: so }, { result: "in_play", prob: Math.max(0.20, 1.0 - (walk + so)) }];
}
function resolveStatcastInPlay(batter, pitcher) {
    let bCon = parseInt(batter["繝溘�繝�"])||50; let bPow = parseInt(batter["繝代Ρ繝ｼ"])||50;
    let pPow = parseInt(pitcher["逅�ｨ�"])||50; let pCtrl = parseInt(pitcher["蛻ｶ逅�"])||50;
    let gbProb = 0.45 - (bPow-50)*0.0015 + (pCtrl-50)*0.0020;
    let fbProb = 0.25 + (bPow-50)*0.0015 - (pPow-50)*0.0020;
    let r = Math.random() * (gbProb + fbProb + 0.30);
    let bType = r < gbProb ? "GB" : (r < gbProb + fbProb ? "FB" : "LD");
    
    if (bType === "GB") return Math.random() > 0.72 ? (Math.random() < 0.10 ? "double" : "single") : (Math.random() < 0.02 ? "error" : "out");
    if (bType === "FB") {
        let hrProb = clamp(0.030 + (bPow - 50) * 0.0040, 0.0, 0.40);
        if (Math.random() < hrProb) return "hr";
        return Math.random() > 0.82 ? (Math.random() < 0.65 ? "single" : "double") : "out";
    }
    return Math.random() > 0.30 ? "single" : "out";
}
function simulateAtBatOutcome(batter, pitcher, gameOuts) {
    let probs = atBatProbabilities(batter, pitcher, gameOuts);
    let r1 = Math.random(); let cum = 0.0;
    for (let p of probs) { cum += p.prob; if (r1 <= cum) { if (p.result !== "in_play") return p.result; break; } }
    return resolveStatcastInPlay(batter, pitcher);
}

function advanceBases(bases, batter, result) {
    let runs = 0;
    if(result==="hr") { runs += (bases[0]?1:0)+(bases[1]?1:0)+(bases[2]?1:0)+1; return {newBases:[null,null,null], runs}; }
    if(result==="walk") {
        const next = [...bases];
        if (bases[0]) {
            if (bases[1]) {
                if (bases[2]) runs++;
                next[2] = bases[1];
            }
            next[1] = bases[0];
        }
        next[0] = batter;
        return { newBases: next, runs };
    }
    let shift = result==="single"?1:(result==="double"?2:3);
    for(let i=2; i>=0; i--) { if(bases[i]) { if(i+shift >= 3) runs++; else bases[i+shift] = bases[i]; bases[i] = null; } }
    bases[shift-1] = batter;
    return {newBases: bases, runs};
}

class PitchingState {

        this.current_start_outs = 0;

        this.max_pitches = new Map();

        if (inning === 12 && score_diff === 0) return ["謚代∴", "荳ｭ邯吶℃繧ｨ繝ｼ繧ｹ", "蜒�ｷｮ", "繝ｪ繝ｼ繝�", "繝薙ワ繧､繝ｳ繝�", "謨玲姶蜃ｦ逅�"];
        if (inning >= 6 && inning <= 8 && score_diff >= 1 && score_diff <= 3) return ["荳ｭ邯吶℃繧ｨ繝ｼ繧ｹ", "蜒�ｷｮ", "繝ｪ繝ｼ繝�", "謚代∴", "繝薙ワ繧､繝ｳ繝�", "謨玲姶蜃ｦ逅�"];
        if (inning >= 1 && inning <= 8 && score_diff >= 4) return ["繝ｪ繝ｼ繝�", "蜒�ｷｮ", "荳ｭ邯吶℃繧ｨ繝ｼ繧ｹ", "繝薙ワ繧､繝ｳ繝�", "謚代∴", "謨玲姶蜃ｦ逅�"];
        if (inning >= 9 && inning <= 12 && score_diff >= 4) return ["繝ｪ繝ｼ繝�", "謚代∴", "荳ｭ邯吶℃繧ｨ繝ｼ繧ｹ", "蜒�ｷｮ", "繝薙ワ繧､繝ｳ繝�", "謨玲姶蜃ｦ逅�"];
        if (inning >= 1 && inning <= 9 && score_diff >= -3 && score_diff <= -1) return ["繝薙ワ繧､繝ｳ繝�", "謨玲姶蜃ｦ逅�", "繝ｪ繝ｼ繝�", "蜒�ｷｮ", "荳ｭ邯吶℃繧ｨ繝ｼ繧ｹ", "謚代∴"];
        if (inning >= 1 && inning <= 9 && score_diff <= -4) return ["謨玲姶蜃ｦ逅�", "繝薙ワ繧､繝ｳ繝�", "繝ｪ繝ｼ繝�", "蜒�ｷｮ", "荳ｭ邯吶℃繧ｨ繝ｼ繧ｹ", "謚代∴"];
        if (inning >= 6 && inning <= 8 && score_diff === 0) return ["蜒�ｷｮ", "荳ｭ邯吶℃繧ｨ繝ｼ繧ｹ", "繝ｪ繝ｼ繝�", "謚代∴", "繝薙ワ繧､繝ｳ繝�", "謨玲姶蜃ｦ逅�"];
        if (inning >= 1 && inning <= 5 && score_diff >= 0) return ["繝ｪ繝ｼ繝�", "蜒�ｷｮ", "繝薙ワ繧､繝ｳ繝�", "荳ｭ邯吶℃繧ｨ繝ｼ繧ｹ", "謨玲姶蜃ｦ逅�", "謚代∴"];
        if (inning >= 10 && score_diff < 0) return ["繝薙ワ繧､繝ｳ繝�", "蜒�ｷｮ", "繝ｪ繝ｼ繝�", "謨玲姶蜃ｦ逅�", "荳ｭ邯吶℃繧ｨ繝ｼ繧ｹ", "謚代∴"];
        if (inning >= 9 && score_diff === 0) return ["謚代∴", "荳ｭ邯吶℃繧ｨ繝ｼ繧ｹ", "蜒�ｷｮ", "繝ｪ繝ｼ繝�", "繝薙ワ繧､繝ｳ繝�", "謨玲姶蜃ｦ逅�"];
        return ["蜒�ｷｮ", "荳ｭ邯吶℃繧ｨ繝ｼ繧ｹ", "繝薙ワ繧､繝ｳ繝�", "繝ｪ繝ｼ繝�", "謨玲姶蜃ｦ逅�", "謚代∴"];
    }

    chooseStarter(rotationIdx) {
        if (this.starters.length === 0) return null;
        let p = this.starters[rotationIdx % this.starters.length];
        this._initPitcher(p, 0, 0);
        return p;
    }

    _initPitcher(p, defScore, offScore) {
        p.stats.pitched_today = true;
        p.stats.pitches_today = 0;
        p.stats.games++;
        p.force_continue_outs = 0;
        this.current = p;
        this.current_start_outs = 0;
        this.pitcher_runs.set(p, 0);

        this.pitchersUsedRecord.push({
            p: p, outs: 0, er: 0,
            entryScoreDef: defScore, entryScoreOff: offScore,
            exitScoreDef: defScore, exitScoreOff: offScore
        });
    }

    shouldReplace(score_diff, inning) {
        let p = this.current;
        if (!p) return false;

        let runs = this.pitcher_runs.get(p) || 0;
        let current_outs = this.current_start_outs;
        let isStarter = this.starters.includes(p);
        
        if (!isStarter && current_outs >= 3) {
            if (score_diff >= 1 && score_diff <= 3 && p !== this.closer) return true;
        }

        if (inning >= 9 && score_diff >= 1 && score_diff <= 3 && this.closer && p !== this.closer) {
            if (this.closer.stats.pitches_today === 0 && this.closer.stats.games_pitched_in_row < 3) return true;
        }

        let pitches = p.stats.pitches_today;
        if (!this.max_pitches.has(p)) {
            let stamina = parseInt(p["繧ｹ繧ｿ繝溘リ"]) || 50;
            let limit = 0;
            if (isStarter && stamina <= 53) {
                limit = stamina * (0.8 + Math.random() * 0.3) + 20;
            } else if (isStarter) {
                limit = stamina * (1.1 + Math.random() * 0.2) + 20;
            } else {
                limit = Math.min(stamina * (1.1 + Math.random() * 0.2) + 20, 45);
            }
            this.max_pitches.set(p, Math.max(15, limit));
        }

        let max_limit = this.max_pitches.get(p);
        let is_stamina_empty = pitches >= max_limit;
        let role = this.getRole(p);

        if (runs >= 6) return true;
        if (runs >= 5 && current_outs >= 9) return true;
        if (runs >= 4 && current_outs >= 15) return true;
        if (runs >= 3 && current_outs >= 18) return true;
        if (is_stamina_empty) return true;
        if (isStarter) return false;

        if (["蜒�ｷｮ", "荳ｭ邯吶℃繧ｨ繝ｼ繧ｹ", "謚代∴"].includes(role) && current_outs > 0) return true;
        if ((p.force_continue_outs || 0) > 0 && current_outs < p.force_continue_outs) return false;

        let priority = this.getRolePriority(inning, score_diff);
        if (priority && role === priority[0]) return false;
        
        return true;
    }

    _selectBullpen(inning, score_diff) {
        let priority = this.getRolePriority(inning, score_diff);
        let available = [];
        let all_bullpen = [...this.bullpen];
        if (this.closer) all_bullpen.push(this.closer);

        for (let p of all_bullpen) {
            if (this.used_bullpen.includes(p)) continue;
            if (p.stats.games_pitched_in_row >= 3) continue; 
            available.push(p);
        }

        let fresh = available.filter(p => p.stats.games_pitched_in_row < 2);

        let pick = (pool, prio_list) => {
            for (let r of prio_list) {
                let candidates = pool.filter(p => this.getRole(p) === r);
                if (candidates.length > 0) {
                    candidates.sort((a,b) => (parseInt(b["繧ｹ繧ｿ繝溘リ"])||50) - (parseInt(a["繧ｹ繧ｿ繝溘リ"])||50));
                    return candidates[0];
                }
            }
            return null;
        };

        let selected = pick(fresh, priority) || pick(available, priority);
        if (!selected) {
            let emergency = all_bullpen.filter(p => !this.used_bullpen.includes(p));
            if (emergency.length > 0) {
                emergency.sort((a,b) => (parseInt(b["繧ｹ繧ｿ繝溘リ"])||50) - (parseInt(a["繧ｹ繧ｿ繝溘リ"])||50));
                selected = emergency[0];
            }
        }

        if (selected) {
            let role = this.getRole(selected);
            if (role === "繝ｪ繝ｼ繝�" && priority[0] === "繝ｪ繝ｼ繝�" && score_diff >= 4) {
                if (Math.random() < 0.5) selected.force_continue_outs = 6;
            } else if (role === "謨玲姶蜃ｦ逅�" && priority[0] === "謨玲姶蜃ｦ逅�") {
                selected.force_continue_outs = Math.random() < 0.4 ? 9 : 6;
            }
        }
        return selected;
    }

    replace(inning, score_diff, defScore, offScore) {
        let old = this.current;
        if (!old) return null;
        let newP = this._selectBullpen(inning, score_diff);
        if (!newP || newP === old) return old;

        let oldRec = this.pitchersUsedRecord[this.pitchersUsedRecord.length - 1];
        oldRec.exitScoreDef = defScore;
        oldRec.exitScoreOff = offScore;

        if (newP !== this.closer && !this.used_bullpen.includes(newP)) {
            this.used_bullpen.push(newP);
        }
        this._initPitcher(newP, defScore, offScore);
        return newP;
    }

    addOut() {
        this.current_start_outs++;
        this.current.stats.outs++;
        this.pitchersUsedRecord[this.pitchersUsedRecord.length - 1].outs++;
    }

    addRun() {
        let r = (this.pitcher_runs.get(this.current) || 0) + 1;
        this.pitcher_runs.set(this.current, r);
        this.current.stats.runs++;
        this.current.stats.er++; 
        this.pitchersUsedRecord[this.pitchersUsedRecord.length - 1].er++;
    }

    finishGame(defScore, offScore) {
        let last = this.pitchersUsedRecord[this.pitchersUsedRecord.length - 1];
        if (last) { last.exitScoreDef = defScore; last.exitScoreOff = offScore; }
    }
}


function makeBattingStats() { return { pa:0, ab:0, hit:0, hr:0, rbi:0, bb:0, so:0, sb:0, runs:0 }; }
function makePitchingStats() { return { games:0, outs:0, runs:0, er:0, wins:0, losses:0, saves:0, holds:0, so:0, games_pitched_in_row:0, pitched_today:false, pitches_today:0 }; }
function makeFieldingStats() { return { chances:0, errors:0 }; }

function startPennant() {
    showScreen('screen-result');
    allTeams.forEach(t => {
        t.wins = 0; t.losses = 0; t.rotationIdx = 0;
        t.fielders.forEach(p => { p.stats = makeBattingStats(); p.fieldStats = makeFieldingStats(); });
        t.pitchers.forEach(p => { p.stats = makePitchingStats(); p.battingStats = makeBattingStats(); });
    });

    // 隗｣譫舌＠縺�160譌･髢薙�繧ｹ繧ｱ繧ｸ繝･繝ｼ繝ｫ繧貞ｮ溯｡�
    scheduleMatches.forEach(dayMatches => {
        allTeams.forEach(t => t.pitchers.forEach(p => { p.stats.pitched_today = false; p.stats.pitches_today = 0; }));
        let teamsPlayed = new Set();
        dayMatches.forEach(match => { playGame(match[0], match[1]); teamsPlayed.add(match[0]); teamsPlayed.add(match[1]); });
        allTeams.forEach(t => {
            if(teamsPlayed.has(t)) t.rotationIdx = (t.rotationIdx + 1) % 6;
            t.pitchers.forEach(p => { if (p.stats.pitched_today) p.stats.games_pitched_in_row++; else p.stats.games_pitched_in_row = 0; });
        });
    });

    let rankList = [...allTeams].sort((a,b)=>b.wins-a.wins);
    let myRank = rankList.findIndex(t=>t===myTeam) + 1;
    document.getElementById('final-rank').innerHTML = `12逅�屮荳ｭ <span style="color:#c62828; font-size:40px;">${myRank}菴�</span>`;
    
    let tableHtml = `<table><tr><th>鬆�ｽ�</th><th>繝√�繝�蜷�</th><th>蜍�</th><th>謨�</th><th>蜍晉紫</th></tr>`;
    rankList.forEach((t, i) => {
        let wp = (t.wins / (t.wins + t.losses)).toFixed(3).replace(/^0\./, '.');
        let bg = t === myTeam ? 'style="background-color:#fff9c4; font-weight:bold;"' : '';
        tableHtml += `<tr ${bg}><td>${i+1}</td><td>${t.name}</td><td>${t.wins}</td><td>${t.losses}</td><td>${wp}</td></tr>`;
    });
    document.getElementById('tab-standings').innerHTML = tableHtml + `</table>`;

    let statFHtml = `<table><tr><th>謇馴��</th><th>螳亥ｙ菴咲ｽｮ</th><th>驕ｸ謇句錐</th><th>謇鍋紫</th><th>譛ｬ蝪∵遠</th><th>謇鍋せ</th><th>逶怜｡�</th><th>螟ｱ遲�</th></tr>`;
    myTeam.fielders.filter(p=>p.order !== '謗ｧ縺�').forEach(p => {
        const s = p.stats || makeBattingStats(); const fs = p.fieldStats || makeFieldingStats();
        let avg = s.ab > 0 ? (s.hit / s.ab).toFixed(3).replace(/^0\./, '.') : '.000';
        statFHtml += `<tr><td>${p.order ?? '-'}</td><td>${p.pos || '-'}</td><td style="font-weight:bold;">${p["驕ｸ謇句錐"] || '荳肴�'}</td><td>${avg}</td><td>${s.hr||0}</td><td>${s.rbi||0}</td><td>${s.sb||0}</td><td>${fs.errors||0}</td></tr>`;
    });
    document.getElementById('tab-fielders').innerHTML = statFHtml + `</table>`;

    let statPHtml = `<table><tr><th>蠖ｹ蜑ｲ</th><th>驕ｸ謇句錐</th><th>逋ｻ譚ｿ</th><th>謚慕帥蝗�</th><th>閾ｪ雋ｬ轤ｹ</th><th>髦ｲ蠕｡邇�</th><th>螂ｪ荳画険</th><th>蜍�</th><th>謨�</th><th>繧ｻ</th><th>HP</th></tr>`;
    myTeam.pitchers.forEach(p => {
        const s = p.stats || makePitchingStats();
        let era = s.outs > 0 ? ((s.er * 27) / s.outs).toFixed(2) : '0.00';
        let innings = Math.floor((s.outs||0) / 3) + "." + ((s.outs||0) % 3);
        statPHtml += `<tr><td>${p.role || '-'}</td><td style="font-weight:bold;">${p["驕ｸ謇句錐"] || '荳肴�'}</td><td>${s.games||0}</td><td>${innings}</td><td>${s.er||0}</td><td>${era}</td><td>${s.so||0}</td><td>${s.wins||0}</td><td>${s.losses||0}</td><td>${s.saves||0}</td><td>${s.holds||0}</td></tr>`;
    });
    document.getElementById('tab-pitchers').innerHTML = statPHtml + `</table>`;
}

function playGame(teamAway, teamHome) {
    let awayPitching = new PitchingState(teamAway, teamAway.rotationIdx);
    let homePitching = new PitchingState(teamHome, teamHome.rotationIdx);
    let state = {
        away: { team: teamAway, score: 0, batIdx: 0, pState: awayPitching, isCentralGame: teamAway.isCentral },
        home: { team: teamHome, score: 0, batIdx: 0, pState: homePitching, isCentralGame: teamHome.isCentral }
    };
    for (let inning = 1; inning <= 9; inning++) {
        playHalfInning(state.away, state.home, inning);
        if (inning === 9 && state.home.score > state.away.score) break; 
        playHalfInning(state.home, state.away, inning);
    }
    awayPitching.finishGame(state.away.score, state.home.score); homePitching.finishGame(state.home.score, state.away.score);
    if (state.away.score > state.home.score) { teamAway.wins++; teamHome.losses++; assignPitcherRecords(awayPitching, homePitching); } 
    else if (state.home.score > state.away.score) { teamHome.wins++; teamAway.losses++; assignPitcherRecords(homePitching, awayPitching); }
}

function playHalfInning(offense, defense, inning) {
    let outs = 0; let bases = [null, null, null]; let defState = defense.pState;
    if (defState.shouldReplace(defense.score - offense.score, inning)) defState.replace(inning, defense.score - offense.score, defense.score, offense.score);

    while (outs < 3) {
        if (defState.shouldReplace(defense.score - offense.score, inning)) defState.replace(inning, defense.score - offense.score, defense.score, offense.score);
        let batOrder = offense.batIdx % 9;
        let pitcherBatting = offense.isCentralGame && batOrder === 8;
        let batter = pitcherBatting ? offense.pState.current : (offense.team.fielders.find(f => f.order === batOrder + 1) || offense.team.fielders[batOrder]);
        if (!batter) { offense.batIdx++; continue; }
        let batStats = pitcherBatting ? (batter.battingStats || (batter.battingStats = makeBattingStats())) : (batter.stats || (batter.stats = makeBattingStats()));
        if (pitcherBatting) { batter["繝溘�繝�"] = 15; batter["繝代Ρ繝ｼ"] = 15; }
        let pitcher = defState.current;
        batStats.pa++;
        let result = simulateAtBatOutcome(batter, pitcher, defState.current_start_outs);
        pitcher.stats.pitches_today += result === 'walk' ? 5 + Math.floor(Math.random()*2) : (result === 'so' ? 4 + Math.floor(Math.random()*3) : 3 + Math.floor(Math.random()*4));

        if (result === 'so') { batStats.ab++; batStats.so++; pitcher.stats.so++; outs++; defState.addOut(); }
        else if (result === 'out') { batStats.ab++; outs++; defState.addOut(); }
        else if (result === 'error') {
            // 謇楢��蜃ｺ蝪√＠縲√い繧ｦ繝域焚縺ｯ蠅励∴縺ｪ縺�らｰ｡譏薙Δ繝�Ν縺ｨ縺励※螟ｱ遲悶ｒ1縺､險倬鹸縲�
            batStats.ab++;
            const fielders = defense.team.fielders.filter(f => f.order !== '謗ｧ縺�');
            if (fielders.length) { const f = fielders[Math.floor(Math.random()*fielders.length)]; f.fieldStats ||= makeFieldingStats(); f.fieldStats.chances++; f.fieldStats.errors++; }
            bases[0] = batter;
        } else if (result === 'walk') { batStats.bb++; }
        else {
            batStats.ab++; batStats.hit++;
            if (result === 'hr') batStats.hr++;
        }

        if (result !== 'out' && result !== 'so' && result !== 'error') {
            let adv = advanceBases(bases, batter, result); bases = adv.newBases;
            if (adv.runs > 0) {
                offense.score += adv.runs; batStats.rbi += adv.runs;
                for (let r=0; r<adv.runs; r++) { defState.addRun(); }
            }
        } else if (result === 'error') {
            // 繧ｨ繝ｩ繝ｼ蜃ｺ蝪√�蝪∫憾豕√�邁｡譏灘�逅��縺ｿ陦後≧縲�
        }

        // 荳蝪∬ｵｰ閠��逶怜｡√ｒ邁｡譏灘愛螳夲ｼ郁ｵｰ蜉帙′鬮倥＞縺ｻ縺ｩ謌仙粥縺励ｄ縺吶＞�峨�
        if (bases[0] && !bases[1] && outs < 2 && Math.random() < 0.10 + (clamp(parseInt(bases[0]["襍ｰ蜉�"])||50, 1, 100) * 0.002)) {
            const runner = bases[0];
            const successChance = clamp(0.55 + ((parseInt(runner["襍ｰ蜉�"])||50)-50)*0.006, 0.25, 0.90);
            if (Math.random() < successChance) { bases[1] = runner; bases[0] = null; const rs = runner.battingStats || runner.stats || (runner.battingStats = makeBattingStats()); rs.sb = (rs.sb||0)+1; }
            else { bases[0] = null; outs++; defState.addOut(); }
        }
        offense.batIdx++;
    }
}function assignPitcherRecords(winPState, losePState) {
    let wU = winPState.pitchersUsedRecord; let lU = losePState.pitchersUsedRecord;
    let wp = null; let tl = 0;
    for (let i = wU.length - 1; i >= 0; i--) { if (wU[i].entryScoreDef <= wU[i].entryScoreOff) { tl = i; break; } }
    if (tl === 0 && wU[tl].outs < 15 && wU.length > 1) wp = wU.slice(1).sort((a,b)=>b.outs-a.outs)[0].p; else wp = wU[tl].p;
    if (wp) wp.stats.wins++;

    let lp = null;
    for (let i = lU.length - 1; i >= 0; i--) { if (lU[i].entryScoreDef >= lU[i].entryScoreOff && lU[i].exitScoreDef < lU[i].exitScoreOff) { lp = lU[i].p; break; } }
    if (!lp) lp = [...lU].sort((a,b)=>b.er-a.er)[0].p;
    if (lp) lp.stats.losses++;

    let svP = null; let lastW = wU[wU.length - 1];
    if (lastW.p !== wp && wU.length > 1 && lastW.outs >= 1) {
        let lead = lastW.entryScoreDef - lastW.entryScoreOff;
        if ((lead > 0 && lead <= 3) || lastW.outs >= 9) { svP = lastW.p; svP.stats.saves++; }
    }

    for (let i = 1; i < wU.length; i++) {
        if (wU[i].p === wp || wU[i].p === svP || wU[i].outs === 0) continue;
        if (wU[i].entryScoreDef - wU[i].entryScoreOff >= 0 && wU[i].exitScoreDef - wU[i].exitScoreOff >= 0) wU[i].p.stats.holds++;
    }
}
